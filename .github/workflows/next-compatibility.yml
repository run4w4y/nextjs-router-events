name: Next Compatibility

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        next-version:
          - 14.2.35
          - 15.5.15
          - 16.2.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pin Next.js ${{ matrix.next-version }} in the example app
        run: bun add next@${{ matrix.next-version }} --cwd apps/example --exact

      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium

      - name: Build workspace
        run: bun run build

      - name: Run example e2e suite
        run: NX_DAEMON=false NX_ISOLATE_PLUGINS=false node ./node_modules/nx/bin/nx.js run example:test:e2e
